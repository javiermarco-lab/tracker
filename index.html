if(d.primer_paso===1)f.push('<b>Has amanecido con dolor al pisar.</b> Semana de descarga: volumen al 60%, cero impacto extra. Esto no se negocia.');

function lectura(){

else{

L.push('Adherencia de <b>'+a7+'%</b> en 7 dias: <b>'+cal+'</b>. '+(a7>=80?'Ese es el nivel que hace que el plan funcione.':a7>=60?'Por debajo del 80% el estimulo se diluye. Recorta bloques antes que hacerlos a medias.':'Ahora mismo el plan no se esta ejecutando. Reduce a tres bloques al dia y consolida eso.'));

else if(t7>t28+0.2)L.push('Dolor tibial <b>subiendo</b> ('+t7+' frente a '+t28+'). No avances de fase esta semana.');

}else if(t7!==null)L.push('Dolor tibial medio de <b>'+t7+'</b>. Necesito cuatro semanas para darte una tendencia real.');

if(dp>0.7)L.push('Peso <b>subiendo</b> ('+p7+' kg frente a '+p28+'). Mas de medio kilo por semana sostenido es grasa, no musculo, y es carga extra sobre la tibia.');
else if(dp<-0.7)L.push('Peso <b>bajando</b> ('+p7+' kg). Vigila que la proteina no caiga.');
else L.push('Peso <b>estable</b> en '+p7+' kg. Es lo que buscas: recomposicion, no ganancia de peso.');
}else if(p7!==null)L.push('Peso medio de <b>'+p7+' kg</b> esta semana.');

}
var mA=mesActual(),ing=sumaMes(mA,'ingreso'),gas=sumaMes(mA,'gasto');

if(gAnt>0){var dif=Math.round((gas-gAnt)*100)/100;
if(Math.abs(dif)>20)L.push('Gasto '+(dif>0?'<b>por encima</b>':'<b>por debajo</b>')+' del mes pasado en '+eur(Math.abs(dif))+'.')}

}

L.push('Vas por el <b>dia '+dayNum()+' de 126</b>, '+phase().toLowerCase()+'. '+(falta===0?'Esta semana toca test de medidas.':'Siguiente test en '+falta+' semana(s).')+(w<5?' La pliometria entra en la semana 5.':''));
return L}

else{h+='<table class="tb"><tr><th>Ejercicio</th><th style="text-align:right">Ultimo</th><th style="text-align:right">Mejor</th></tr>';

h+='</div></div>'}
h+='<p class="note">Tus datos estan en Supabase, no en el movil. Puedes entrar desde cualquier dispositivo y siguen ahi.</p>'}
r.innerHTML=h}
estado('Cargando datos');
cargar().then(function(){estado('');draw()})['catch'](function(e){estado('No se pudo conectar con la base de datos',1);console.error(e);document.getElementById('root').innerHTML='<p style="padding:40px 0;color:#666">No se pudo conectar. Revisa la conexion y recarga.</p>'});

<script>
var vistaMes=0, altaTipo='gasto';
function mesDesplazado(n){var d=new Date();d.setDate(1);d.setMonth(d.getMonth()-n);return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function setMes(n){vistaMes=n;draw()}
function setAltaTipo(t){altaTipo=t;draw()}
function altaManual(){
var c=document.getElementById('a_con').value.trim();
var im=document.getElementById('a_imp').value;
var ca=document.getElementById('a_cat').value;
var fe=document.getElementById('a_fec').value||tk();
if(!im){alert('Falta el importe');return}
var fila={fecha:fe,tipo:altaTipo,categoria:altaTipo==='ingreso'?'ingreso':ca,concepto:c||ca,importe:parseFloat(String(im).split(',').join('.')),fijo:false};
estado('Guardando');
api('POST','finanzas',[fila]).then(function(r){S.fin=r.concat(S.fin);estado('Guardado');draw()})['catch'](function(e){estado('Error al guardar',1)})}
function hojaHTML(){
var mes=mesDesplazado(vistaMes),i,h='';
var filas=S.fin.filter(function(f){return f.fecha.slice(0,7)===mes});
filas.sort(function(a,b){return a.fecha<b.fecha?1:-1});
var ti=0,tg=0;
h+='<h2>Hoja de movimientos</h2>';
h+='<div class="mesnav">';
for(i=0;i<3;i++)h+='<button class="'+(vistaMes===i?'on':'')+'" onclick="setMes('+i+')">'+mesDesplazado(i)+'</button>';
h+='</div>';
h+='<table class="hoja"><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Ingreso</th><th style="text-align:right">Gasto</th><th></th></tr>';
for(i=0;i<filas.length;i++){var f=filas[i],im=parseFloat(f.importe);
if(f.tipo==='ingreso')ti+=im;else tg+=im;
h+='<tr><td style="white-space:nowrap;color:#999;font-size:12px">'+f.fecha.slice(8)+'/'+f.fecha.slice(5,7)+'</td>'
+'<td>'+f.concepto+'<div class="cat">'+f.categoria+(f.fijo?' · fijo':'')+'</div></td>'
+'<td class="n">'+(f.tipo==='ingreso'?im.toFixed(2):'')+'</td>'
+'<td class="n">'+(f.tipo==='gasto'?im.toFixed(2):'')+'</td>'
+'<td class="n"><span class="del" onclick="borrarFin('+f.id+')">x</span></td></tr>'}
if(!filas.length)h+='<tr><td colspan="5" style="color:#999;font-size:12px;padding:16px 6px">Sin movimientos este mes.</td></tr>';
h+='<tr class="tot"><td></td><td>Total</td><td class="n">'+ti.toFixed(2)+'</td><td class="n">'+tg.toFixed(2)+'</td><td></td></tr>';
h+='<tr class="tot" style="border-top:none"><td></td><td>Neto</td><td class="n" colspan="2">'+(ti-tg).toFixed(2)+'</td><td></td></tr>';
h+='</table>';
h+='<div class="alta"><div class="tp"><button class="'+(altaTipo==='gasto'?'on':'')+'" onclick="setAltaTipo(\'gasto\')">Gasto</button><button class="'+(altaTipo==='ingreso'?'on':'')+'" onclick="setAltaTipo(\'ingreso\')">Ingreso</button></div>';
h+='<div class="fila"><input id="a_fec" type="date" value="'+tk()+'"><input id="a_imp" class="imp" type="number" step="0.01" inputmode="decimal" placeholder="0,00"></div>';
h+='<div class="fila"><input id="a_con" type="text" placeholder="Concepto"><select id="a_cat">';
for(i=0;i<CATS.length;i++)h+='<option value="'+CATS[i]+'">'+CATS[i]+'</option>';
h+='</select></div><button class="gbtn" style="margin-top:2px" onclick="altaManual()">Anadir a la hoja</button></div>';
return h}
var _drawOrig = draw;
draw = function(){
  _drawOrig();
  if(tab==='din'){
    var r=document.getElementById('root');
    var movs=r.querySelectorAll('.mov');
    for(var i=0;i<movs.length;i++)movs[i].style.display='none';
    var h2s=r.querySelectorAll('h2');
    for(var j=0;j<h2s.length;j++)if(h2s[j].textContent.indexOf('Movimientos')>=0)h2s[j].style.display='none';
    r.insertAdjacentHTML('beforeend', hojaHTML());
  }
};
if(typeof S!=='undefined' && S.inicio) draw();
</script>

<script>
var TOK=null;
function leerHash(){
  var h=window.location.hash;
  if(h && h.indexOf('access_token')>=0){
    var p={},partes=h.substring(1).split('&');
    for(var i=0;i<partes.length;i++){var kv=partes[i].split('=');p[kv[0]]=decodeURIComponent(kv[1]||'')}
    if(p.access_token){
      try{localStorage.setItem('tok',p.access_token);localStorage.setItem('tok_exp',String(Date.now()+(parseInt(p.expires_in||'3600')*1000)))}catch(e){}
      history.replaceState(null,'',window.location.pathname);
      return p.access_token;
    }
  }
  try{
    var t=localStorage.getItem('tok'),e=parseInt(localStorage.getItem('tok_exp')||'0');
    if(t && e>Date.now()) return t;
  }catch(e){}
  return null;
}
function salir(){try{localStorage.removeItem('tok');localStorage.removeItem('tok_exp')}catch(e){}location.reload()}
function enviarEnlace(){
  var em=document.getElementById('log_em').value.trim();
  if(!em||em.indexOf('@')<0){alert('Escribe tu correo');return}
  var b=document.getElementById('log_bt');b.textContent='Enviando...';b.disabled=true;
  fetch('https://wsqjswbcgrbtlemqgejg.supabase.co/auth/v1/otp',{
    method:'POST',
    headers:{'apikey':KEY_DB,'Content-Type':'application/json'},
    body:JSON.stringify({email:em,create_user:true,options:{email_redirect_to:'https://javiermarco-lab.github.io/tracker/'}})
  }).then(function(r){return r.text()}).then(function(){
    document.getElementById('log_msg').innerHTML='<div class="ok"><b>Enlace enviado a '+em+'</b><br>Abre el correo desde este mismo dispositivo y pulsa el enlace. Si no lo ves, mira en spam.</div>';
    b.textContent='Reenviar enlace';b.disabled=false;
  })['catch'](function(){b.textContent='Error, reintentar';b.disabled=false});
}
function pantallaLogin(){
  document.getElementById('sync').innerHTML='';
  document.getElementById('root').innerHTML='<div class="login"><h1>Panel personal</h1><p>Entra con tu correo. Te llega un enlace y no hace falta contrasena.</p><input id="log_em" type="email" inputmode="email" autocomplete="email" placeholder="tu@correo.com"><button id="log_bt" onclick="enviarEnlace()">Enviarme el enlace</button><div id="log_msg"></div></div>';
}
var _apiOrig = api;
api = function(metodo,ruta,cuerpo){
  var o={method:metodo,headers:{'apikey':KEY_DB,'Authorization':'Bearer '+(TOK||KEY_DB),'Content-Type':'application/json','Prefer':metodo==='POST'?'return=representation':'resolution=merge-duplicates,return=representation'}};
  if(cuerpo)o.body=JSON.stringify(cuerpo);
  return fetch(URL_DB+ruta,o).then(function(r){
    if(r.status===401||r.status===403){salir();throw new Error('sesion caducada')}
    if(!r.ok)return r.text().then(function(t){throw new Error(t)});
    return r.status===204?null:r.json()})
};
var _drawConHoja = draw;
draw = function(){
  _drawConHoja();
  if(TOK && tab==='dash'){
    document.getElementById('root').insertAdjacentHTML('beforeend','<button class="salir" onclick="salir()">Cerrar sesion</button>');
  }
};
function arrancar(){
  TOK = leerHash();
  if(!TOK){ pantallaLogin(); return; }
  estado('Cargando datos');
  cargar().then(function(){estado('');draw()})['catch'](function(e){
    console.error(e);
    if(String(e.message).indexOf('sesion')<0){estado('No se pudo conectar',1)}
  });
}
setTimeout(arrancar, 400);
</script>
