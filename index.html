function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function tk(){return iso(new Date())}

function tingle(){var d=today();d.tingle=!d.tingle;save();draw()}

function dOff(n){var d=new Date();d.setDate(d.getDate()-n);return data.days[iso(d)]}
function doneCount(rec){var c=0,j;if(!rec)return 0;for(j=0;j<DAILY.length;j++)if(rec.done[DAILY[j][0]])c++;return c}
function adher(n){var s=0,t=0,i,lim=Math.min(n,dayNum());for(i=0;i<lim;i++){s+=doneCount(dOff(i));t+=DAILY.length}return t?Math.round(s/t*100):0}
function painAvg(n,id){var v=[],i,r;for(i=0;i<n;i++){r=dOff(i);if(r&&r.pain[id]!==null&&r.pain[id]!==undefined)v.push(r.pain[id])}if(!v.length)return null;var s=0;for(i=0;i<v.length;i++)s+=v[i];return Math.round(s/v.length*10)/10}
function pesoUlt(n){var v=[],i,r;for(i=0;i<n;i++){r=dOff(i);if(r&&r.peso)v.push(r.peso)}if(!v.length)return null;var s=0;for(i=0;i<v.length;i++)s+=v[i];return Math.round(s/v.length*10)/10}

function hormigueoReciente(){var i,r;for(i=0;i<7;i++){r=dOff(i);if(r&&r.tingle)return true}return false}

function parseDic(){
var el=document.getElementById('dic'),t=(el.value||'').toLowerCase();
if(!t){alert('Dicta o escribe algo primero');return}
var partes=t.split(/[,;\n]+/),n=0,i,k;
for(i=0;i<partes.length;i++){var p=' '+partes[i].trim()+' ';if(!p.trim())continue;
var nom=null;
for(k in ALIAS){if(p.indexOf(k)>=0){if(!nom||k.length>nom[0].length)nom=[k,ALIAS[k]]}}
if(!nom)continue;
var resto=p.split(nom[0]).join(' ');
var mS=resto.match(/(\d+)\s*(?:x|por)\s*(\d+)/);
var ser=null,rep=null;
if(mS){ser=parseInt(mS[1]);rep=parseInt(mS[2]);resto=resto.split(mS[0]).join(' ')}
var mP=resto.match(/(\d+(?:[.,]\d+)?)/);
var peso=mP?parseFloat(mP[1].split(',').join('.')):null;
if(peso===null&&ser===null)continue;
gymDia().push({e:nom[1],w:peso,s:ser,r:rep});n++}
save();el.value='';
if(n===0)alert('No he reconocido ningun ejercicio. Prueba asi: sentadilla 80 4x5');
draw()}
function ultimo(nom){var ks=[],k,i,j;for(k in data.gym)ks.push(k);ks.sort();
for(i=ks.length-1;i>=0;i--){var arr=data.gym[ks[i]];for(j=arr.length-1;j>=0;j--)if(arr[j].e===nom&&arr[j].w!=null)return {w:arr[j].w,d:ks[i]}}
return null}
function anterior(nom){var ks=[],k,i,j,f=0;for(k in data.gym)ks.push(k);ks.sort();
for(i=ks.length-1;i>=0;i--){var arr=data.gym[ks[i]];for(j=arr.length-1;j>=0;j--)if(arr[j].e===nom&&arr[j].w!=null){f++;if(f===2)return arr[j].w}}
return null}
function mejor(nom){var b=null,k,i;for(k in data.gym)for(i=0;i<data.gym[k].length;i++){var s=data.gym[k][i];if(s.e===nom&&s.w!=null&&(b===null||s.w>b))b=s.w}return b}
function usados(){var out=[],k,i;for(k in data.gym)for(i=0;i<data.gym[k].length;i++){var e=data.gym[k][i].e;if(out.indexOf(e)<0)out.push(e)}out.sort();return out}
function totalSeries(){var c=0,k;for(k in data.gym)c+=data.gym[k].length;return c}
function subiendoCargas(){var us=usados(),n=0,i;for(i=0;i<us.length;i++){var u=ultimo(us[i]),a=anterior(us[i]);if(u&&a!=null&&u.w>a)n++}return n}

var f=[],d=today(),w=weekNum(),dow=new Date().getDay();
var t2=painAvg(2,'tibia');
if(d.paso===1)f.push('<b>Has amanecido con dolor al pisar.</b> Semana de descarga: volumen al 60%, cero impacto extra. Esto no se negocia.');
if(d.tingle||hormigueoReciente())f.push('<b>Codo en retroceso.</b> Bajas una etapa de tiro esta semana. No provoques el chasquido ni para comprobarlo.');
if(t2!==null&&t2>3)f.push('<b>Tibia cargada.</b> Menos 20% de volumen en pierna y cero impacto extra.');
if(w%4===0)f.push('<b>Semana de descarga.</b> Volumen al 60%, intensidad igual. Encontrarte bien es la senal de que hace falta.');
if(!d.done.pie)f.push('<b>Protocolo pie-tibia.</b> Es el bloque que trata la lesion. Si hoy solo haces una cosa, que sea el gemelo sentado.');
if(dow===1||dow===3||dow===5){if(!d.done.ses)f.push('<b>'+SES[dow][0]+'.</b> Tres series, 2 repeticiones en reserva. Nada de bloquear el codo.')}
else if(dow===0)f.push('<b>Descanso.</b> Sin fuerza ni baloncesto. Solo flexibilidad larga.');
else if(!d.done.ses)f.push('<b>Baloncesto, maximo 60 min.</b> '+stage()+'. Paras si aparece hormigueo o dolor tibial.');
if(w<5)f.push('<b>Sin pliometria ni saltos.</b> Entra en la semana 5 y solo si el dolor tibial esta estable en 2 o menos.');
if(!d.done.suen)f.push('<b>Dormir 8 h.</b> Es la herramienta de recuperacion mas potente que tienes.');
if(pendAbiertos()>0&&dayNum()%7===1)f.push('<b>Tienes '+pendAbiertos()+' pendiente(s) medico(s).</b> Miralo en la pestana Tests.');
if(adher(7)<60&&dayNum()>7)f.push('<b>Adherencia floja.</b> Prioriza AM, pie-tibia y sueno. Lo demas es secundario esta semana.');
return f.slice(0,4)}
function lectura(){
var L=[],a7=adher(7),a28=adher(28),w=weekNum();
var t7=painAvg(7,'tibia'),t28=painAvg(28,'tibia');
if(dayNum()<4){L.push('Llevas <b>'+dayNum()+' dia(s)</b>. Todavia no hay datos suficientes para leer nada. Vuelve el dia 7.');return L}
var cal=a7>=95?'excelente':a7>=80?'solida':a7>=60?'irregular':'floja';
L.push('Adherencia de <b>'+a7+'%</b> en 7 dias: <b>'+cal+'</b>. '+(a7>=80?'Ese es el nivel que hace que el plan funcione.':a7>=60?'Por debajo del 80% el estimulo se diluye. Recorta bloques antes que hacerlos a medias.':'Ahora mismo el plan no se esta ejecutando. Reduce a tres bloques al dia y consolida eso.'));
if(a28>0&&Math.abs(a7-a28)>=8)L.push(a7>a28?'Vas <b>mejorando</b>: la semana esta '+(a7-a28)+' puntos por encima de tu media de 28 dias.':'Has <b>bajado</b> '+(a28-a7)+' puntos respecto a tu media mensual. Suele indicar que el volumen supera lo que puedes sostener.');
if(t7!==null&&t28!==null){
if(t7<t28-0.2)L.push('Dolor tibial <b>bajando</b> ('+t7+' frente a '+t28+'). La tibia esta ganando capacidad. Manten el protocolo, no lo aceleres.');
else if(t7>t28+0.2)L.push('Dolor tibial <b>subiendo</b> ('+t7+' frente a '+t28+'). No avances de fase esta semana. Revisa el volumen de impacto de los ultimos 7 dias.');
else L.push('Dolor tibial <b>estable</b> en '+t7+'. Estable no es fracaso: en una lesion de cuatro anos, no empeorar mientras subes carga ya es progreso.');
}else if(t7!==null)L.push('Dolor tibial medio de <b>'+t7+'</b>. Necesito cuatro semanas de registro para darte una tendencia real.');
else L.push('<b>Sin datos de dolor.</b> Es el numero mas importante del plan. Apuntalo cada manana al levantarte.');
var p7=pesoUlt(7),p28=pesoUlt(28);
if(p7!==null&&p28!==null){var dp=Math.round((p7-p28)*10)/10;
if(dp>0.7)L.push('Peso <b>subiendo</b> ('+p7+' kg frente a '+p28+' de media mensual). Mas de medio kilo por semana sostenido es grasa, no musculo, y es carga extra sobre la tibia.');
else if(dp<-0.7)L.push('Peso <b>bajando</b> ('+p7+' kg). Vigila que la proteina no caiga: perder peso rapido se lleva musculo por delante.');
else L.push('Peso <b>estable</b> en '+p7+' kg. Es exactamente lo que buscas: recomposicion, no ganancia de peso.');
}else if(p7!==null)L.push('Peso medio de <b>'+p7+' kg</b> esta semana. Con cuatro semanas te dare la tendencia.');
var s7=seriesUlt7(),sub=subiendoCargas();
if(s7===0&&w>1)L.push('<b>Sin series de gimnasio registradas</b> esta semana. Sin ese dato no se puede saber si la fuerza sube.');
else if(s7>0)L.push('<b>'+s7+' series</b> en 7 dias'+(sub>0?', y <b>'+sub+' ejercicio(s) han subido</b> de carga.':'. Cuando repitas ejercicio veras si la carga sube.'));
if(pendAbiertos()>0)L.push('<b>'+pendAbiertos()+' pendiente(s) medico(s) sin resolver.</b> Es lo unico del plan que no se arregla entrenando.');
var falta=(4-(w%4))%4;
L.push('Vas por el <b>dia '+dayNum()+' de 126</b>, '+phase().toLowerCase()+'. '+(falta===0?'Esta semana toca test de medidas.':'Siguiente test en '+falta+' semana(s).')+(w<5?' La pliometria entra en la semana 5.':''));
if(new Date().getDay()===0)L.push('<b>Es domingo: exporta tu copia de seguridad.</b> Pestana Tests, boton Exportar, y pega el texto en Notas.');
return L}
