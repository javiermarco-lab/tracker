<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan 3x3">
<meta name="theme-color" content="#0B1D2E">
<title>Plan 3x3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 16px 60px;background:#0B1D2E;color:#E6EFF6;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5}
.w{max-width:540px;margin:0 auto}
.hd{border-bottom:1px solid rgba(160,196,224,.3);padding:22px 0 16px;margin-bottom:16px}
.eye{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8FA9BF;margin:0 0 12px}
.big{font-size:54px;font-weight:700;line-height:1}
.of{font-size:14px;color:#8FA9BF}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid rgba(160,196,224,.3);padding:5px 8px;color:#8FA9BF;margin:8px 5px 0 0}
.tag.hot{border-color:#F2A65A;color:#F2A65A}
.dt{font-size:12px;color:#8FA9BF;margin-top:10px}
.nav{margin-bottom:14px}
.nav button{width:24%;background:transparent;border:1px solid rgba(160,196,224,.3);color:#8FA9BF;font-size:11px;text-transform:uppercase;padding:10px 2px;margin-right:1%;font-family:inherit}
.nav button.on{border-color:#5B9BD5;color:#E6EFF6}
h2{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#8FA9BF;font-weight:600;margin:24px 0 10px}
.it{border:1px solid rgba(160,196,224,.18);border-left:3px solid rgba(160,196,224,.3);background:rgba(18,43,66,.5);padding:12px 13px;margin-bottom:6px}
.it.on{border-left-color:#3FB8A0;background:rgba(63,184,160,.1)}
.it .l{font-size:14px}
.it .d{font-size:11.5px;color:#8FA9BF;margin-top:3px}
.ck{float:left;width:19px;height:19px;border:1px solid rgba(160,196,224,.3);margin-right:12px;text-align:center;line-height:18px;font-size:12px;color:transparent}
.it.on .ck{border-color:#3FB8A0;color:#3FB8A0}
.cl{clear:both}
.pain{border:1px solid rgba(160,196,224,.18);background:rgba(18,43,66,.5);padding:12px 13px;margin-bottom:6px}
.pt{overflow:hidden;margin-bottom:9px}
.pt .n{float:left;font-size:13px}
.pt .v{float:right;font-size:21px;font-weight:700}
.sc button{width:8.4%;height:28px;margin-right:.4%;background:transparent;border:1px solid rgba(160,196,224,.3);color:#8FA9BF;font-size:10px;padding:0;font-family:inherit}
.al{border-left:3px solid #E4572E;background:rgba(228,87,46,.1);padding:11px 13px;margin-bottom:8px;font-size:12.5px}
.al b{display:block;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.rule{border:1px solid rgba(160,196,224,.18);background:rgba(18,43,66,.5);margin-bottom:6px}
.rule .h{padding:12px 13px;font-size:13px}
.rule ul{margin:0;padding:0 13px 13px 30px;font-size:12.5px;color:#8FA9BF}
.rule li{margin-bottom:6px}
.m{border-bottom:1px solid rgba(160,196,224,.18);padding:9px 0;overflow:hidden}
.m label{float:left;font-size:12.5px;color:#8FA9BF;width:65%}
.m input{float:right;width:72px;background:transparent;border:1px solid rgba(160,196,224,.3);color:#E6EFF6;font-size:14px;padding:6px;text-align:right;font-family:inherit}
.note{font-size:11.5px;color:#8FA9BF;margin-top:12px}
.start{text-align:center;padding:50px 0}
.start button{background:transparent;border:1px solid #5B9BD5;color:#E6EFF6;font-size:13px;padding:13px 26px;margin-top:20px;font-family:inherit}
.wk{overflow:hidden}
.wk .d{float:left;width:13.5%;margin-right:1%;border:1px solid rgba(160,196,224,.18);padding:8px 2px;text-align:center}
.wk .d.t{border-color:#5B9BD5}
.wk .n{font-size:10px;color:#8FA9BF}
.wk .b{height:34px;margin:6px 2px 0;background:rgba(160,196,224,.3);position:relative}
.wk .b i{position:absolute;bottom:0;left:0;right:0;background:#3FB8A0}
.wk .p{font-size:10px;margin-top:5px;color:#8FA9BF}
</style>
</head>
<body>
<div class="w" id="root"></div>
<script>
var KEY='tracker-v3',tab='hoy',data={start:null,days:{},metrics:{}};
var SES={1:['Sesion A - Pierna rodilla + core','Sentadilla, bulgara, nordico, hip thrust'],2:['Baloncesto','Volumen de tiro segun etapa'],3:['Sesion B - Torso + hombro','Press, dominadas, militar, remo, face pull'],4:['Baloncesto','Volumen de tiro segun etapa'],5:['Sesion C - Pierna cadera + potencia','RDL, frontal, zancadas, gemelo pesado'],6:['Baloncesto','Volumen de tiro segun etapa'],0:['Descanso','Solo flexibilidad larga, 20-25 min']};
var DAILY=[['am','Bloque AM','12 min, movilidad sin impacto'],['pie','Protocolo pie-tibia','9 min, soleo sentado, arco, tibial'],['codo','Bloque codo-hombro','8 min, isometricos 90 grados, antebrazo'],['flex','Flexibilidad','12 min, noche, nunca antes de fuerza'],['ses','Sesion programada',''],['prot','Proteina en las 3 comidas','Palma de mano por comida'],['crea','Creatina 5 g','Cualquier hora, con agua'],['suen','Sueno 8 h','Es parte del plan, no un extra'],['azuc','Sin ultraprocesados','Fruta y carbo peri-entreno si son limpios']];
var PAINS=[['tibia','Dolor tibia'],['lumbar','Dolor lumbar'],['codoP','Dolor codo'],['planta','Dolor planta del pie']];
var METRICS=[['ktw','Knee-to-wall','cm'],['sr','Sit and reach','cm'],['plI','Plancha lateral izq','s'],['plD','Plancha lateral der','s'],['eq','Equilibrio ojos cerrados','s'],['calf','Gemelo 1 pierna','reps'],['salto','Salto vertical','cm'],['sent','Sentadilla 5RM','kg'],['peso','Peso medio semanal','kg']];
var RULES=[['Regla del dolor',['Durante el ejercicio: hasta 3/10 es aceptable.','A las 24 h peor que el dia anterior: menos 20% de volumen en la siguiente sesion.','Dolor al caminar por la manana: semana de descarga.']],['Codo - retroceso',['Hormigueo en cualquier momento: bajas una etapa de tiro una semana.','Nunca provoques el chasquido a voluntad.','Fuera: fondos, press cerrado pesado, extensiones en rango final, flexiones con bloqueo, burpees.','Al medico ya si: el codo se bloquea, pierdes extension completa, hinchazon, o el hormigueo pasa a constante.']],['Pliometria - entrada',['Semana 5 como minimo.','4 semanas seguidas con dolor tibial menor o igual a 2/10.','Se cuenta por contactos, no por series. Si ese dia juegas, no hay pliometria.','40, 60, 80, 100 contactos. Dos sesiones por semana.']],['Comer - decisiones rapidas',['Proteina del tamano de tu palma en cada comida. Es la unica variable que importa.','Despues de entrenar: platano, yogur griego, batido, fruta con frutos secos.','Hambre entre horas: huevo cocido, requeson, atun, fruta. Barrita solo si lleva mas proteina que azucar.','Antes de jugar: carbohidrato si. Un platano no es una concesion, es combustible.','Fuera: refrescos, bolleria, snacks de bolsa, alcohol.','Regla 90/10. Las normas absolutas se rompen enteras el dia que fallas una vez.']],['Descarga y sueno',['Semanas 4, 8, 12 y 16: volumen al 60%, intensidad igual.','Domingo sin fuerza ni baloncesto.','Dos noches seguidas bajo 6 h: el dia de fuerza pasa a dia de movilidad.','Creatina 5 g diarios. Subiras 1-2 kg de agua las primeras semanas: no toques nada por eso.']]];
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function tk(){return iso(new Date())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function load(){try{var v=localStorage.getItem(KEY);if(v)data=JSON.parse(v)}catch(e){}}
function dayNum(){if(!data.start)return 1;var a=new Date(data.start+'T00:00:00'),b=new Date(tk()+'T00:00:00');return Math.floor((b-a)/86400000)+1}
function weekNum(){return Math.floor((dayNum()-1)/7)+1}
function phase(){var w=weekNum();if(w<=6)return 'Fase 1 - Base';if(w<=12)return 'Fase 2 - Fuerza';if(w<=18)return 'Fase 3 - Potencia';return 'Fase 4 - Competicion'}
function stage(){var w=weekNum();if(w<=2)return 'Etapa 1 - cero tiro';if(w<=4)return 'Etapa 2 - 50 tiros';if(w<=6)return 'Etapa 3 - 100 tiros';return 'Etapa 4 - 150-200 tiros'}
function today(){var k=tk();if(!data.days[k])data.days[k]={done:{},pain:{},tingle:false};return data.days[k]}
function begin(){data.start=tk();save();draw()}
function go(t){tab=t;draw()}
function tog(id){var d=today();d.done[id]=!d.done[id];save();draw()}
function setPain(id,v){var d=today();d.pain[id]=(d.pain[id]===v)?null:v;save();draw()}
function tingle(){var d=today();d.tingle=!d.tingle;save();draw()}
function setM(w,id,v){if(!data.metrics[w])data.metrics[w]={};data.metrics[w][id]=v;save()}
function exportar(){window.prompt('Copia este texto y guardalo. Es tu copia de seguridad.',JSON.stringify(data))}
function importar(){var t=window.prompt('Pega aqui tu copia de seguridad:');if(!t)return;try{data=JSON.parse(t);save();draw()}catch(e){alert('No se pudo leer')}}
function alerts(){var out=[],d=today(),i,k;
if(d.tingle)out.push(['#E4572E','Hormigueo registrado','Retrocede una etapa de tiro durante una semana. Nada de provocar el chasquido, ni para comprobarlo.']);
var ks=[];for(k in data.days)ks.push(k);ks.sort();var l2=[];
for(i=Math.max(0,ks.length-2);i<ks.length;i++){var p=data.days[ks[i]].pain.tibia;if(p!==null&&p!==undefined)l2.push(p)}
if(l2.length===2&&l2[0]>3&&l2[1]>3)out.push(['#F2A65A','Tibia sobre 3 dos dias','Baja el volumen un 20% en la proxima sesion de pierna. No avances de fase aunque toque por calendario.']);
if(d.pain.codoP>3)out.push(['#F2A65A','Codo sobre 3','Fuera extensiones, fondos y flexiones con bloqueo. Isometricos a 90 grados y nada mas.']);
if(weekNum()%4===0)out.push(['#F2A65A','Semana de descarga','Volumen al 60%, intensidad igual. Si te encuentras genial y quieres saltartela, esa es la senal de que hace falta.']);
if(weekNum()<=4)out.push(['#3FB8A0','Fase de base','Sin pliometria, sin saltos, sin cargas maximas. Entra en semana 5 solo si el dolor tibial lleva estable en 2 o menos.']);
return out}
function draw(){var r=document.getElementById('root'),h='',i,j;
if(!data.start){r.innerHTML='<div class="start"><p class="eye">Plan fisico - 3x3</p><p style="color:#8FA9BF;font-size:14px">El plan arranca el dia que lo marques.<br>126 dias hasta el final de la fase 4.</p><button onclick="begin()">Empezar hoy</button></div>';return}
var d=today(),dow=new Date().getDay(),nd=new Date();
var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var dias=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
h+='<div class="hd"><p class="eye">Plan fisico - 3x3</p><span class="big">'+dayNum()+'</span> <span class="of">/ 126 dias</span><div><span class="tag">Semana '+weekNum()+'</span><span class="tag">'+phase()+'</span><span class="tag">'+stage()+'</span>'+(weekNum()%4===0?'<span class="tag hot">Descarga</span>':'')+'</div><div class="dt">'+dias[nd.getDay()]+' '+nd.getDate()+' de '+meses[nd.getMonth()]+'</div></div>';
h+='<div class="nav"><button class="'+(tab==='hoy'?'on':'')+'" onclick="go(\'hoy\')">Hoy</button><button class="'+(tab==='sem'?'on':'')+'" onclick="go(\'sem\')">Semana</button><button class="'+(tab==='reg'?'on':'')+'" onclick="go(\'reg\')">Reglas</button><button class="'+(tab==='med'?'on':'')+'" onclick="go(\'med\')">Medidas</button></div>';
if(tab==='hoy'){var A=alerts();
for(i=0;i<A.length;i++)h+='<div class="al" style="border-left-color:'+A[i][0]+';background:'+A[i][0]+'1a"><b style="color:'+A[i][0]+'">'+A[i][1]+'</b>'+A[i][2]+'</div>';
var dc=0;for(i=0;i<DAILY.length;i++)if(d.done[DAILY[i][0]])dc++;
h+='<h2>Bloques del dia &nbsp; '+dc+'/'+DAILY.length+'</h2>';
for(i=0;i<DAILY.length;i++){var id=DAILY[i][0];var lab=(id==='ses')?SES[dow][0]:DAILY[i][1];var det=(id==='ses')?SES[dow][1]:DAILY[i][2];
h+='<div class="it '+(d.done[id]?'on':'')+'" onclick="tog(\''+id+'\')"><div class="ck">X</div><div class="l">'+lab+'</div>'+(det?'<div class="d">'+det+'</div>':'')+'<div class="cl"></div></div>'}
h+='<h2>Dolor - 0 a 10</h2>';
for(i=0;i<PAINS.length;i++){var pid=PAINS[i][0],v=d.pain[pid],has=(v!==null&&v!==undefined);
var col=!has?'#8FA9BF':(v<=2?'#3FB8A0':(v<=4?'#F2A65A':'#E4572E'));
h+='<div class="pain"><div class="pt"><span class="n">'+PAINS[i][1]+'</span><span class="v" style="color:'+col+'">'+(has?v:'-')+'</span></div><div class="sc">';
for(j=0;j<=10;j++){var sel=(v===j),c=j<=2?'#3FB8A0':(j<=4?'#F2A65A':'#E4572E');
h+='<button onclick="setPain(\''+pid+'\','+j+')" style="'+(sel?'background:'+c+';border-color:'+c+';color:#0B1D2E;font-weight:700':'')+'">'+j+'</button>'}
h+='</div></div>'}
h+='<div class="it '+(d.tingle?'on':'')+'" onclick="tingle()" style="'+(d.tingle?'border-left-color:#E4572E;background:rgba(228,87,46,.1)':'')+'"><div class="ck">X</div><div class="l">Hormigueo en menique o anular</div><div class="cl"></div></div>'}
if(tab==='sem'){h+='<h2>Ultimos 7 dias</h2><div class="wk">';var nm=['D','L','M','X','J','V','S'];
for(i=6;i>=0;i--){var dd=new Date();dd.setDate(dd.getDate()-i);var rec=data.days[iso(dd)],done=0;
if(rec)for(j=0;j<DAILY.length;j++)if(rec.done[DAILY[j][0]])done++;
var pv=rec&&rec.pain.tibia!==undefined&&rec.pain.tibia!==null?rec.pain.tibia:'-';
h+='<div class="d '+(i===0?'t':'')+'"><div class="n">'+nm[dd.getDay()]+'</div><div class="b"><i style="height:'+Math.round(done/DAILY.length*100)+'%"></i></div><div class="p">'+pv+'</div></div>'}
h+='</div><div class="cl"></div><p class="note">La barra son bloques completados. El numero de abajo es el dolor tibial: es el dato que decide si avanzas de fase o no.</p>'}
if(tab==='reg'){h+='<h2>Reglas que no se negocian</h2>';
for(i=0;i<RULES.length;i++){h+='<div class="rule"><div class="h">'+RULES[i][0]+'</div><ul>';
for(j=0;j<RULES[i][1].length;j++)h+='<li>'+RULES[i][1][j]+'</li>';h+='</ul></div>'}}
if(tab==='med'){var W=[4,8,12,16];h+='<h2>Tests cada 4 semanas</h2>';
for(i=0;i<W.length;i++){h+='<div class="rule"><div class="h">Semana '+W[i]+(weekNum()===W[i]?' - toca ahora':'')+'</div><div style="padding:0 13px 8px">';
for(j=0;j<METRICS.length;j++){var mv=(data.metrics[W[i]]&&data.metrics[W[i]][METRICS[j][0]])||'';
h+='<div class="m"><label>'+METRICS[j][1]+' ('+METRICS[j][2]+')</label><input type="number" value="'+mv+'" onchange="setM('+W[i]+',\''+METRICS[j][0]+'\',this.value)"><div class="cl"></div></div>'}
h+='</div></div>'}
h+='<p class="note">Si entre plancha lateral izquierda y derecha hay mas de un 20% de diferencia, anade una serie extra al lado debil hasta igualar.</p><h2>Copia de seguridad</h2><div class="nav"><button style="width:49%" onclick="exportar()">Exportar</button><button style="width:49%" onclick="importar()">Importar</button></div><p class="note">Los datos viven en este navegador. Exporta de vez en cuando y guardate el texto en Notas.</p>'}
r.innerHTML=h}
load();draw();
</script>
</body>
</html>
