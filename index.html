<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plan 3x3">
<meta name="theme-color" content="#FFFFFF">
<title>Plan 3x3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:0 18px 70px;background:#fff;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.w{max-width:560px;margin:0 auto}
.hd{border-bottom:1px solid #111;padding:24px 0 14px;margin-bottom:18px}
.eye{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#888;margin:0 0 10px}
.big{font-size:56px;font-weight:800;line-height:.95;letter-spacing:-2px}
.of{font-size:13px;color:#888}
.tag{display:inline-block;font-size:10px;letter-spacing:1px;text-transform:uppercase;border:1px solid #ddd;padding:5px 8px;color:#666;margin:10px 5px 0 0}
.tag.hot{border-color:#111;background:#111;color:#fff}
.dt{font-size:12px;color:#888;margin-top:10px}
.nav{display:flex;gap:4px;margin-bottom:18px}
.nav button{flex:1;background:#fff;border:1px solid #ddd;color:#888;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:11px 2px;font-family:inherit}
.nav button.on{border-color:#111;background:#111;color:#fff}
h2{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#888;font-weight:600;margin:26px 0 10px}
.it{border:1px solid #eee;border-left:3px solid #eee;padding:12px 13px;margin-bottom:6px}
.it.on{border-color:#111;border-left-color:#111;background:#111;color:#fff}
.it .l{font-size:14px}
.it .d{font-size:11.5px;color:#999;margin-top:3px}
.it.on .d{color:#bbb}
.ck{float:left;width:18px;height:18px;border:1px solid #ccc;margin-right:12px;text-align:center;line-height:17px;font-size:11px;color:transparent}
.it.on .ck{border-color:#fff;color:#fff}
.cl{clear:both}
.pain{border:1px solid #eee;padding:12px 13px;margin-bottom:6px}
.pt{overflow:hidden;margin-bottom:9px}
.pt .n{float:left;font-size:13px}
.pt .v{float:right;font-size:22px;font-weight:800}
.sc{display:flex;gap:3px}
.sc button{flex:1;min-width:0;height:30px;background:#fff;border:1px solid #ddd;color:#999;font-size:11px;padding:0;font-family:inherit}
.sc button.s{background:#111;border-color:#111;color:#fff;font-weight:700}
.al{border:1px solid #111;padding:12px 13px;margin-bottom:8px;font-size:12.5px;line-height:1.55}
.al.k{background:#111;color:#fff}
.al b{display:block;font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.rule{border:1px solid #eee;margin-bottom:6px}
.rule .h{padding:12px 13px;font-size:13px;font-weight:600}
.rule ul{margin:0;padding:0 13px 13px 30px;font-size:12.5px;color:#666}
.rule li{margin-bottom:6px}
.m{border-bottom:1px solid #eee;padding:10px 0;overflow:hidden}
.m label{float:left;font-size:12.5px;color:#666;width:62%}
.m input{float:right;width:76px;background:#fff;border:1px solid #ddd;color:#111;font-size:14px;padding:7px;text-align:right;font-family:inherit}
.note{font-size:11.5px;color:#999;margin-top:12px;line-height:1.6}
.start{text-align:center;padding:60px 0}
.start button{background:#111;border:1px solid #111;color:#fff;font-size:13px;padding:14px 28px;margin-top:22px;font-family:inherit}
.wk{display:flex;gap:4px}
.wk .d{flex:1;border:1px solid #eee;padding:8px 2px;text-align:center}
.wk .d.t{border-color:#111}
.wk .n{font-size:10px;color:#999}
.wk .b{height:36px;margin:6px 3px 0;background:#f0f0f0;position:relative}
.wk .b i{position:absolute;bottom:0;left:0;right:0;background:#111}
.wk .p{font-size:10px;margin-top:5px;color:#666}
.kpi{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.kpi .c{flex:1 1 45%;border:1px solid #eee;padding:14px 13px}
.kpi .k{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:#999;margin-bottom:6px}
.kpi .n{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1}
.kpi .s{font-size:11px;color:#888;margin-top:4px}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid #111;margin-bottom:6px}
.bars .b{flex:1;background:#111;min-height:1px}
.bars .b.e{background:#e8e8e8}
.lbl{display:flex;gap:4px;font-size:9.5px;color:#aaa}
.lbl span{flex:1;text-align:center}
.spark{display:flex;align-items:flex-end;gap:2px;height:60px;border-bottom:1px solid #ddd;margin-bottom:6px}
.spark .b{flex:1;background:#111;min-height:1px}
.prog{height:8px;background:#f0f0f0;margin:6px 0 4px;position:relative}
.prog i{position:absolute;top:0;bottom:0;left:0;background:#111}
</style>
</head>
<body>
<div class="w" id="root"></div>
<script>
var KEY='tracker-v3',tab='hoy',data={start:null,days:{},metrics:{}};
var SES={1:['Sesion A - Pierna rodilla + core','Sentadilla, bulgara, nordico, hip thrust'],2:['Baloncesto','Volumen de tiro segun etapa'],3:['Sesion B - Torso + hombro','Press, dominadas, militar, remo, face pull'],4:['Baloncesto','Volumen de tiro segun etapa'],5:['Sesion C - Pierna cadera + potencia','RDL, frontal, zancadas, gemelo pesado'],6:['Baloncesto','Volumen de tiro segun etapa'],0:['Descanso','Solo flexibilidad larga, 20-25 min']};
var DAILY=[['am','Bloque AM','12 min, movilidad sin impacto'],['pie','Protocolo pie-tibia','9 min, soleo sentado, arco, tibial'],['codo','Bloque codo-hombro','8 min, isometricos 90 grados, antebrazo'],['flex','Flexibilidad','12 min, noche, nunca antes de fuerza'],['ses','Sesion programada',''],['prot','Proteina en las 3 comidas','Palma de mano por comida'],['crea','Creatina 5 g','Cualquier hora, con agua'],['suen','Sueno 8 h','Es parte del plan, no un extra'],['azuc','Sin ultraprocesados','Fruta y carbo peri-entreno si son limpios']];
var PAINS=[['tibia','Dolor tibia'],['lumbar','Dolor lumbar'],['codoP','Dolor codo'],['planta','Dolor planta del pie']];
var METRICS=[['ktw','Knee-to-wall','cm'],['sr','Sit and reach','cm'],['plI','Plancha lateral izq','s'],['plD','Plancha lateral der','s'],['eq','Equilibrio ojos cerrados','s'],['calf','Gemelo 1 pierna','reps'],['salto','Salto vertical','cm'],['sent','Sentadilla 5RM','kg'],['peso','Peso medio semanal','kg']];
var RULES=[['Regla del dolor',['Durante el ejercicio: hasta 3/10 es aceptable.','A las 24 h peor que el dia anterior: menos 20% de volumen en la siguiente sesion.','Dolor al caminar por la manana: semana de descarga.']],['Codo - retroceso',['Hormigueo en cualquier momento: bajas una etapa de tiro una semana.','Nunca provoques el chasquido a voluntad.','Fuera: fondos, press cerrado pesado, extensiones en rango final, flexiones con bloqueo, burpees.','Al medico ya si: el codo se bloquea, pierdes extension completa, hinchazon, o el hormigueo pasa a constante.']],['Pliometria - entrada',['Semana 5 como minimo.','4 semanas seguidas con dolor tibial menor o igual a 2.','Se cuenta por contactos, no por series. Si ese dia juegas, no hay pliometria.','40, 60, 80, 100 contactos. Dos sesiones por semana.']],['Comer - decisiones rapidas',['Proteina del tamano de tu palma en cada comida. Es la unica variable que importa.','Despues de entrenar: platano, yogur griego, batido, fruta con frutos secos.','Hambre entre horas: huevo cocido, requeson, atun, fruta. Barrita solo si lleva mas proteina que azucar.','Antes de jugar: carbohidrato si. Un platano no es una concesion, es combustible.','Fuera: refrescos, bolleria, snacks de bolsa, alcohol.','Regla 90/10. Las normas absolutas se rompen enteras el dia que fallas una vez.']],['Descarga y sueno',['Semanas 4, 8, 12 y 16: volumen al 60%, intensidad igual.','Domingo sin fuerza ni baloncesto.','Dos noches seguidas bajo 6 h: el dia de fuerza pasa a dia de movilidad.','Creatina 5 g diarios. Subiras 1-2 kg de agua las primeras semanas: no toques nada por eso.']]];
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function tk(){return iso(new Date())}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function load(){try{var v=localStorage.getItem(KEY);if(v)data=JSON.parse(v)}catch(e){}}
function dayNum(){if(!data.start)return 1;var a=new Date(data.start+'T00:00:00'),b=new Date(tk()+'T00:00:00');return Math.floor((b-a)/86400000)+1}
function weekNum(){return Math.floor((dayNum()-1)/7)+1}
function phase(){var w=weekNum();if(w<=6)return 'Fase 1 - Base';if(w<=12)return 'Fase 2 - Fuerza';if(w<=18)return 'Fase 3 - Potencia';return 'Fase 4 - Competicion'}
function stage(){var w=weekNum();if(w<=2)return 'Etapa 1 - cero tiro';if(w<=4)return 'Etapa 2 - 50 tiros';if(w<=6)return 'Etapa 3 - 100 tiros';return 'Etapa 4 - 150-200 tiros'}
function today(){var k=tk();if(!data.days[k])data.days[k]={done:{},pain:{},tingle:false};return data.days[k]}
function begin(){data.start=tk();save();draw()}
function go(t){tab=t;draw();window.scrollTo(0,0)}
function tog(id){var d=today();d.done[id]=!d.done[id];save();draw()}
function setPain(id,v){var d=today();d.pain[id]=(d.pain[id]===v)?null:v;save();draw()}
function tingle(){var d=today();d.tingle=!d.tingle;save();draw()}
function setM(w,id,v){if(!data.metrics[w])data.metrics[w]={};data.metrics[w][id]=v;save()}
function exportar(){window.prompt('Copia este texto y guardalo. Es tu copia de seguridad.',JSON.stringify(data))}
function importar(){var t=window.prompt('Pega aqui tu copia de seguridad:');if(!t)return;try{data=JSON.parse(t);save();draw()}catch(e){alert('No se pudo leer')}}
function dOff(n){var d=new Date();d.setDate(d.getDate()-n);return data.days[iso(d)]}
function doneCount(rec){var c=0,j;if(!rec)return 0;for(j=0;j<DAILY.length;j++)if(rec.done[DAILY[j][0]])c++;return c}
function adher(n){var s=0,t=0,i,lim=Math.min(n,dayNum());for(i=0;i<lim;i++){s+=doneCount(dOff(i));t+=DAILY.length}return t?Math.round(s/t*100):0}
function racha(){var c=0,i;for(i=0;i<400;i++){if(doneCount(dOff(i))>=7)c++;else{if(i===0)continue;break}}return c}
function painAvg(n,id){var v=[],i,r;for(i=0;i<n;i++){r=dOff(i);if(r&&r.pain[id]!==null&&r.pain[id]!==undefined)v.push(r.pain[id])}if(!v.length)return null;var s=0;for(i=0;i<v.length;i++)s+=v[i];return Math.round(s/v.length*10)/10}
function sesiones(){var c=0,k;for(k in data.days)if(data.days[k].done.ses)c++;return c}
function alerts(){var out=[],d=today(),i,k;
if(d.tingle)out.push([1,'Hormigueo registrado','Retrocede una etapa de tiro durante una semana. Nada de provocar el chasquido, ni para comprobarlo.']);
var ks=[];for(k in data.days)ks.push(k);ks.sort();var l2=[];
for(i=Math.max(0,ks.length-2);i<ks.length;i++){var p=data.days[ks[i]].pain.tibia;if(p!==null&&p!==undefined)l2.push(p)}
if(l2.length===2&&l2[0]>3&&l2[1]>3)out.push([1,'Tibia sobre 3 dos dias','Baja el volumen un 20% en la proxima sesion de pierna. No avances de fase aunque toque por calendario.']);
if(d.pain.codoP>3)out.push([1,'Codo sobre 3','Fuera extensiones, fondos y flexiones con bloqueo. Isometricos a 90 grados y nada mas.']);
if(weekNum()%4===0)out.push([1,'Semana de descarga','Volumen al 60%, intensidad igual. Si te encuentras genial y quieres saltartela, esa es la senal de que hace falta.']);
if(weekNum()<=4)out.push([0,'Fase de base','Sin pliometria, sin saltos, sin cargas maximas. Entra en semana 5 solo si el dolor tibial lleva estable en 2 o menos.']);
return out}
function draw(){var r=document.getElementById('root'),h='',i,j;
if(!data.start){r.innerHTML='<div class="start"><p class="eye">Plan fisico - 3x3</p><p style="color:#666;font-size:14px">El plan arranca el dia que lo marques.<br>126 dias hasta el final de la fase 4.</p><button onclick="begin()">Empezar hoy</button></div>';return}
var d=today(),dow=new Date().getDay(),nd=new Date();
var meses=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var dias=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
h+='<div class="hd"><p class="eye">Plan fisico - 3x3</p><span class="big">'+dayNum()+'</span> <span class="of">/ 126 dias</span><div><span class="tag">Semana '+weekNum()+'</span><span class="tag">'+phase()+'</span><span class="tag">'+stage()+'</span>'+(weekNum()%4===0?'<span class="tag hot">Descarga</span>':'')+'</div><div class="dt">'+dias[nd.getDay()]+' '+nd.getDate()+' de '+meses[nd.getMonth()]+'</div></div>';
h+='<div class="nav"><button class="'+(tab==='hoy'?'on':'')+'" onclick="go(\'hoy\')">Hoy</button><button class="'+(tab==='dash'?'on':'')+'" onclick="go(\'dash\')">Panel</button><button class="'+(tab==='reg'?'on':'')+'" onclick="go(\'reg\')">Reglas</button><button class="'+(tab==='med'?'on':'')+'" onclick="go(\'med\')">Medidas</button></div>';
if(tab==='hoy'){var A=alerts();
for(i=0;i<A.length;i++)h+='<div class="al '+(A[i][0]?'k':'')+'"><b>'+A[i][1]+'</b>'+A[i][2]+'</div>';
var dc=doneCount(d);
h+='<h2>Bloques del dia &nbsp;&nbsp; '+dc+'/'+DAILY.length+'</h2>';
for(i=0;i<DAILY.length;i++){var id=DAILY[i][0];var lab=(id==='ses')?SES[dow][0]:DAILY[i][1];var det=(id==='ses')?SES[dow][1]:DAILY[i][2];
h+='<div class="it '+(d.done[id]?'on':'')+'" onclick="tog(\''+id+'\')"><div class="ck">X</div><div class="l">'+lab+'</div>'+(det?'<div class="d">'+det+'</div>':'')+'<div class="cl"></div></div>'}
h+='<h2>Dolor - 0 a 10</h2>';
for(i=0;i<PAINS.length;i++){var pid=PAINS[i][0],v=d.pain[pid],has=(v!==null&&v!==undefined);
h+='<div class="pain"><div class="pt"><span class="n">'+PAINS[i][1]+'</span><span class="v">'+(has?v:'-')+'</span></div><div class="sc">';
for(j=0;j<=10;j++)h+='<button class="'+(v===j?'s':'')+'" onclick="setPain(\''+pid+'\','+j+')">'+j+'</button>';
h+='</div></div>'}
h+='<div class="it '+(d.tingle?'on':'')+'" onclick="tingle()"><div class="ck">X</div><div class="l">Hormigueo en menique o anular</div><div class="cl"></div></div>'}
if(tab==='dash'){
var a7=adher(7),a28=adher(28),aT=adher(400),rc=racha();
var t7=painAvg(7,'tibia'),t28=painAvg(28,'tibia');
var trend='';
if(t7!==null&&t28!==null){if(t7<t28-0.2)trend='bajando';else if(t7>t28+0.2)trend='subiendo';else trend='estable'}
h+='<h2>Disciplina</h2><div class="kpi">';
h+='<div class="c"><div class="k">Adherencia 7 dias</div><div class="n">'+a7+'%</div><div class="s">28 dias: '+a28+'%</div></div>';
h+='<div class="c"><div class="k">Racha</div><div class="n">'+rc+'</div><div class="s">dias seguidos</div></div>';
h+='<div class="c"><div class="k">Sesiones</div><div class="n">'+sesiones()+'</div><div class="s">completadas</div></div>';
h+='<div class="c"><div class="k">Adherencia total</div><div class="n">'+aT+'%</div><div class="s">desde el dia 1</div></div>';
h+='</div>';
h+='<h2>Adherencia por semana</h2><div class="bars">';
var wk=[],ws,wt,x;
for(i=7;i>=0;i--){ws=0;wt=0;for(x=0;x<7;x++){var off=i*7+x;if(off<dayNum()){ws+=doneCount(dOff(off));wt+=DAILY.length}}wk.push(wt?Math.round(ws/wt*100):-1)}
for(i=0;i<wk.length;i++)h+='<div class="b '+(wk[i]<0?'e':'')+'" style="height:'+(wk[i]<0?4:Math.max(wk[i],2))+'%"></div>';
h+='</div><div class="lbl">';
for(i=8;i>=1;i--)h+='<span>'+(weekNum()-i+1>0?'S'+(weekNum()-i+1):'')+'</span>';
h+='</div>';
h+='<h2>Dolor tibial - 28 dias</h2><div class="spark">';
for(i=27;i>=0;i--){var rr=dOff(i),pv2=rr&&rr.pain.tibia!=null?rr.pain.tibia:null;
h+='<div class="b" style="height:'+(pv2===null?0:Math.max(pv2*10,3))+'%"></div>'}
h+='</div><p class="note">Media 7 dias: '+(t7===null?'sin datos':t7)+' &nbsp;|&nbsp; media 28 dias: '+(t28===null?'sin datos':t28)+(trend?' &nbsp;|&nbsp; '+trend:'')+'</p>';
h+='<h2>Progreso del plan</h2><div class="prog"><i style="width:'+Math.min(Math.round(dayNum()/126*100),100)+'%"></i></div><p class="note">Dia '+dayNum()+' de 126. '+phase()+'.</p>';
h+='<h2>Resultados</h2>';
var W=[4,8,12,16],hasM=false;
for(i=0;i<W.length;i++)if(data.metrics[W[i]])hasM=true;
if(!hasM)h+='<p class="note">Aun sin tests. El primero toca en la semana 4. Hasta entonces, lo unico que mide progreso es la adherencia y la tendencia de dolor.</p>';
else{h+='<div class="m" style="border-bottom:1px solid #111;font-weight:600"><label>Test</label><span style="float:right;font-size:12px">S4 / S8 / S12 / S16</span><div class="cl"></div></div>';
for(j=0;j<METRICS.length;j++){var row='';for(i=0;i<W.length;i++){var mv2=(data.metrics[W[i]]&&data.metrics[W[i]][METRICS[j][0]])||'-';row+=mv2+(i<3?' / ':'')}
h+='<div class="m"><label>'+METRICS[j][1]+'</label><span style="float:right;font-size:12px">'+row+'</span><div class="cl"></div></div>'}}
h+='<h2>Ultimos 7 dias</h2><div class="wk">';var nm=['D','L','M','X','J','V','S'];
for(i=6;i>=0;i--){var dd=new Date();dd.setDate(dd.getDate()-i);var rec=data.days[iso(dd)],done=doneCount(rec);
var pv=rec&&rec.pain.tibia!==undefined&&rec.pain.tibia!==null?rec.pain.tibia:'-';
h+='<div class="d '+(i===0?'t':'')+'"><div class="n">'+nm[dd.getDay()]+'</div><div class="b"><i style="height:'+Math.round(done/DAILY.length*100)+'%"></i></div><div class="p">'+pv+'</div></div>'}
h+='</div><p class="note">Barra: bloques completados. Numero: dolor tibial.</p>'}
if(tab==='reg'){h+='<h2>Reglas que no se negocian</h2>';
for(i=0;i<RULES.length;i++){h+='<div class="rule"><div class="h">'+RULES[i][0]+'</div><ul>';
for(j=0;j<RULES[i][1].length;j++)h+='<li>'+RULES[i][1][j]+'</li>';h+='</ul></div>'}}
if(tab==='med'){var WW=[4,8,12,16];h+='<h2>Tests cada 4 semanas</h2>';
for(i=0;i<WW.length;i++){h+='<div class="rule"><div class="h">Semana '+WW[i]+(weekNum()===WW[i]?' - toca ahora':'')+'</div><div style="padding:0 13px 8px">';
for(j=0;j<METRICS.length;j++){var mv=(data.metrics[WW[i]]&&data.metrics[WW[i]][METRICS[j][0]])||'';
h+='<div class="m"><label>'+METRICS[j][1]+' ('+METRICS[j][2]+')</label><input type="number" value="'+mv+'" onchange="setM('+WW[i]+',\''+METRICS[j][0]+'\',this.value)"><div class="cl"></div></div>'}
h+='</div></div>'}
h+='<p class="note">Si entre plancha lateral izquierda y derecha hay mas de un 20% de diferencia, anade una serie extra al lado debil hasta igualar.</p><h2>Copia de seguridad</h2><div class="nav"><button onclick="exportar()">Exportar</button><button onclick="importar()">Importar</button></div><p class="note">Los datos viven en este navegador. Exporta una vez al mes y guardate el texto en Notas.</p>'}
r.innerHTML=h}
load();draw();
</script>
</body>
</html>
